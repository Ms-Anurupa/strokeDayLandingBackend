# Nginx config for Stroke Day. Replace the three example domains, then:
#   sudo cp nginx-strokeday.conf /etc/nginx/sites-available/strokeday
#   sudo ln -s /etc/nginx/sites-available/strokeday /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d strokeday.example.com -d admin.strokeday.example.com -d api.strokeday.example.com

# ---------- API (Express on port 5000) ----------
server {
    listen 80;
    server_name api.strokeday.example.com;

    # Must be at least MAX_VIDEO_SIZE_MB plus room for form fields.
    client_max_body_size 110M;
    client_body_timeout 900s;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_request_buffering off;
    }
}

# ---------- Landing page (static build) ----------
server {
    listen 80;
    server_name strokeday.example.com;

    root /var/www/strokeday/landing;
    index index.html;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}

# ---------- Admin CMS (static build) ----------
server {
    listen 80;
    server_name admin.strokeday.example.com;

    root /var/www/strokeday/admin;
    index index.html;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Frame-Options "DENY" always;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # React Router: send unknown paths to index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
